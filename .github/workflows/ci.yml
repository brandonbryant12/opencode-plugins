name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      - name: Install pinned dependencies with the release-age gate
        run: bun install --frozen-lockfile --minimum-release-age 86400
      - name: Typecheck and test
        run: npm run check
      - name: Test live progress components
        run: npm run test:tui
      - name: Install age-eligible OpenCode 2 runtime
        run: bun add --global --trust --minimum-release-age 86400 @opencode-ai/cli@0.0.0-beta-19157
      - name: Test actual native plugin loading and execution
        run: |
          OPENCODE2_BIN="$(command -v opencode2)" npm run test:native
          GOAL_SMOKE_MODE=swarm OPENCODE2_BIN="$(command -v opencode2)" npm run test:native
          GOAL_SMOKE_MODE=proposal OPENCODE2_BIN="$(command -v opencode2)" npm run test:native
